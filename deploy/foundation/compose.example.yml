# One service, no published ports. Write your probe lines into a foundation.conf next to this file
# (for example `probe web tcp 192.0.2.10:443 60`; see docs/foundation/README.md for the format), then:
#   docker compose -f compose.example.yml up -d --build
# Then make the owner credential once (see README.md, "Run", step 4).
# Build context is the repository root (this file lives in deploy/foundation/).
services:
  foundation:
    build:
      context: ../..
      dockerfile: deploy/foundation/Dockerfile
    image: endora-foundation:local
    # The loop: run-due every minute. SIGTERM (docker stop) ends it cleanly.
    command: ["serve", "--every", "60"]
    restart: unless-stopped
    stop_grace_period: 20s
    # No ports: the program only reaches out (probes) and answers nothing.
    volumes:
      - foundation-data:/data                          # the one SQLite file
      - ./foundation.conf:/config/foundation.conf:ro   # probes; edit on the host, restart
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  foundation-data:
